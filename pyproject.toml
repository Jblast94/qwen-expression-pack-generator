[project]
name = "qwen-expression-pack-generator"
version = "1.0.0"
description = "Expression Pack Generator for SillyTavern + Lumiverse powered by Qwen-Image-Edit-NSFW"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.1.12",
    "tenacity>=8.0.0",
]

[project.scripts]
expression-pack = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
